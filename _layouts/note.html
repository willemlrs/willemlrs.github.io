<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} — Willem Larras</title>
  <meta name="description" content="{{ page.description | default: page.title }}">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="note-page">
    <header>
      <a class="back" href="/">← Willem Larras</a>
      <h1>{{ page.title }}</h1>
      <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%b %-d, %Y' }}</time>
    </header>
    <main class="note">
      {{ content }}
    </main>
  </div>
</body>
</html>
